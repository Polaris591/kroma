[package]
name = "kroma-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Kroma's lightweight cross-platform desktop host"

[lib]
name = "kroma_desktop_lib"
crate-type = ["rlib"]

[[bin]]
name = "kroma-desktop"
path = "src/main.rs"

[dependencies]
kroma = { path = "../.." }
tauri = { version = "2", default-features = true }
tauri-plugin-dialog = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
