name: Project memory plugin

on:
  push:
  pull_request:

jobs:
  plugin:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy
      - name: Format
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --manifest-path examples/plugins/project-memory/Cargo.toml -- --check
      - name: Test plugin
        run: cargo test --locked --manifest-path examples/plugins/project-memory/Cargo.toml
      - name: Lint plugin
        run: cargo clippy --locked --manifest-path examples/plugins/project-memory/Cargo.toml --all-targets -- -D warnings
      - name: Build plugin binary
        run: cargo build --locked --manifest-path examples/plugins/project-memory/Cargo.toml
      - name: Host integration
        env:
          KROMA_MEMORY_BIN: examples/plugins/project-memory/target/debug/kroma-memory${{ matrix.os == 'windows-latest' && '.exe' || '' }}
        run: cargo test --locked --test project_memory_e2e
