name: Release

# Full six-target build, triggered by a version tag. This is the job that would have caught the
# arm64 musl binary shipping with stub SSL symbols (every HTTPS request failed at runtime) and the
# Windows build breaking on an unguarded `#[link(name = "ssl")]`.
#
# Every target is *built and linked* here, never merely type-checked, and the two targets with a
# hand-written TLS backend are additionally smoke-tested at runtime: linux-x64 natively,
# linux-arm64 through qemu. The Android artifact cannot be executed on a GitHub runner; it is
# verified statically (real OpenSSL linked in, no runtime libssl/libcrypto dependency) and the
# device/emulator run remains an explicit manual gate -- see "Known limits" at the bottom.
#
# The macOS binaries are built on a real Mac runner: since the Gate-3 audit macOS uses native-tls,
# so the link needs Security.framework and CoreFoundation.framework, i.e. a genuine SDK.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  OPENSSL_VERSION: '3.5.7'
  ANDROID_NDK_VERSION: '26.3.11579264'

jobs:
  linux:
    name: linux-x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Rust toolchain
        run: |
          toolchain="$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy
          rustup default "$toolchain"
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p kroma-cli
      - run: ./target/release/kroma --version
      # Not a string check and not `--version`: this makes the artifact perform a real HTTPS request
      # and then proves an untrusted certificate is rejected.
      - name: TLS smoke (real HTTPS + untrusted certificate rejected)
        run: scripts/tls-smoke.sh target/release/kroma
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: target/release/kroma
          if-no-files-found: error

  windows:
    name: win32-x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Rust toolchain
        run: |
          toolchain="$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy
          rustup default "$toolchain"
      - run: rustup target add x86_64-pc-windows-gnu
      - run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --target x86_64-pc-windows-gnu -p kroma-cli
      - name: The Windows binary must not depend on OpenSSL
        run: |
          if x86_64-w64-mingw32-objdump -p target/x86_64-pc-windows-gnu/release/kroma.exe \
             | grep -iE 'DLL Name: .*(ssl|crypto)'; then
            echo "::error::the Windows binary links an OpenSSL DLL; it should use schannel only"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: win32-x64
          path: target/x86_64-pc-windows-gnu/release/kroma.exe
          if-no-files-found: error

  macos:
    name: darwin-arm64 + darwin-x64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Rust toolchain
        run: |
          toolchain="$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy
          rustup default "$toolchain"
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      # Both binaries are built in this job, so there is no way for the release to pick up a stale
      # darwin artifact: packaging later consumes exactly what is uploaded here.
      - run: cargo build --release --target aarch64-apple-darwin -p kroma-cli
      - run: cargo build --release --target x86_64-apple-darwin -p kroma-cli
      - run: ./target/aarch64-apple-darwin/release/kroma --version
      - run: ./target/x86_64-apple-darwin/release/kroma --version
      - uses: actions/upload-artifact@v4
        with:
          name: darwin-arm64
          path: target/aarch64-apple-darwin/release/kroma
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: darwin-x64
          path: target/x86_64-apple-darwin/release/kroma
          if-no-files-found: error

  android:
    name: android-arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Rust toolchain
        run: |
          toolchain="$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy
          rustup default "$toolchain"
      - run: rustup target add aarch64-linux-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install the NDK
        run: sdkmanager --install "ndk;${ANDROID_NDK_VERSION}"
      - name: Fetch OpenSSL sources
        run: |
          curl -fsSL --retry 3 -o openssl.tar.gz \
            "https://www.openssl.org/source/openssl-${OPENSSL_VERSION}.tar.gz" \
            || curl -fsSL --retry 3 -o openssl.tar.gz \
            "https://github.com/openssl/openssl/releases/download/openssl-${OPENSSL_VERSION}/openssl-${OPENSSL_VERSION}.tar.gz"
          tar -xzf openssl.tar.gz
      - uses: Swatinem/rust-cache@v2
      # No stubs. Android's own libssl/libcrypto are BoringSSL, which is not an OpenSSL ABI (the
      # SSL_ctrl family this crate calls for SNI was removed) and is not exported to third-party
      # code by the NDK at all. Link a real static OpenSSL instead.
      - name: Build static OpenSSL for aarch64-linux-android
        run: |
          export ANDROID_NDK_ROOT="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}"
          scripts/build-android-openssl.sh "openssl-${OPENSSL_VERSION}" "$PWD/openssl-android" 24
      - name: Build
        env:
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: ${{ github.workspace }}/android-linker.sh
        run: |
          NDK="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64"
          printf '#!/bin/sh\nexec "%s/bin/aarch64-linux-android24-clang" -L"%s/openssl-android/lib" "$@"\n' \
            "$NDK" "$GITHUB_WORKSPACE" > android-linker.sh
          chmod +x android-linker.sh
          cargo build --release --target aarch64-linux-android -p kroma-cli
      - name: The Android binary must carry real OpenSSL, not link-only stubs
        run: |
          NDK_BIN="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          BIN=target/aarch64-linux-android/release/kroma
          # Static OpenSSL means no runtime libssl/libcrypto entry: a NEEDED entry would resolve to
          # Android's BoringSSL on a device and fail at the first HTTPS request.
          "${NDK_BIN}/llvm-readelf" -d "$BIN" > "$RUNNER_TEMP/android.dynamic"
          if grep -E 'NEEDED.*(libssl|libcrypto)' "$RUNNER_TEMP/android.dynamic"; then
            echo "::error::the Android binary dynamically requires libssl/libcrypto (BoringSSL is not OpenSSL ABI)"
            exit 1
          fi
          "${NDK_BIN}/llvm-nm" "$BIN" > "$RUNNER_TEMP/android.nm"
          for sym in TLS_client_method SSL_CTX_new SSL_ctrl SSL_set1_host SSL_connect; do
            grep -qE " [Tt] ${sym}$" "$RUNNER_TEMP/android.nm" || {
              echo "::error::${sym} is not linked into the Android binary; its TLS backend is incomplete"
              exit 1
            }
          done
          strings -a "$BIN" > "$RUNNER_TEMP/android.strings"
          grep -q 'OpenSSL 3' "$RUNNER_TEMP/android.strings" || {
            echo "::error::the Android binary carries no OpenSSL implementation"
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: android-arm64
          path: target/aarch64-linux-android/release/kroma
          if-no-files-found: error

  musl:
    name: linux-arm64 (musl)
    runs-on: ubuntu-latest
    env:
      # Zig writes a cache; the old default (/var/cache/zig) is not writable for the runner user.
      ZIG_GLOBAL_CACHE_DIR: ${{ runner.temp }}/zig-cache
      ZIG_LOCAL_CACHE_DIR: ${{ runner.temp }}/zig-cache
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Rust toolchain
        run: |
          toolchain="$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy
          rustup default "$toolchain"
      - run: rustup target add aarch64-unknown-linux-musl
      - name: Install zig
        run: pip install --break-system-packages ziglang
      - name: Locate the zig installation
        # Do NOT copy the executable out of the pip package: without its sibling lib/ directory
        # every invocation fails with "unable to find zig installation directory".
        run: |
          ZIG="$(python3 -c 'import os, ziglang; print(os.path.join(os.path.dirname(ziglang.__file__), "zig"))')"
          echo "ZIG=${ZIG}" >> "$GITHUB_ENV"
      - name: Fetch OpenSSL sources
        run: |
          curl -fsSL --retry 3 -o openssl.tar.gz \
            "https://www.openssl.org/source/openssl-${OPENSSL_VERSION}.tar.gz" \
            || curl -fsSL --retry 3 -o openssl.tar.gz \
            "https://github.com/openssl/openssl/releases/download/openssl-${OPENSSL_VERSION}/openssl-${OPENSSL_VERSION}.tar.gz"
          tar -xzf openssl.tar.gz
      - uses: Swatinem/rust-cache@v2
      # The arm64 musl binary used to be linked against *stub* SSL symbols, so it had no working
      # TLS at all. Build a real static OpenSSL instead; the script refuses to be a stub.
      - name: Build static OpenSSL for aarch64-musl
        run: scripts/build-musl-openssl.sh "openssl-${OPENSSL_VERSION}" "$PWD/openssl-musl"
      - name: Build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_RUSTFLAGS: -C link-self-contained=no
        run: |
          printf '#!/bin/sh\nexport ZIG_GLOBAL_CACHE_DIR="%s"\nexport ZIG_LOCAL_CACHE_DIR="%s"\nexec "%s" cc -target aarch64-linux-musl -L"%s/openssl-musl/lib" "$@"\n' \
            "$ZIG_GLOBAL_CACHE_DIR" "$ZIG_LOCAL_CACHE_DIR" "$ZIG" "$GITHUB_WORKSPACE" > musl-linker.sh
          chmod +x musl-linker.sh
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER="$PWD/musl-linker.sh" \
            cargo build --release --target aarch64-unknown-linux-musl -p kroma-cli
      - name: The musl binary must actually contain OpenSSL
        # `strings | grep -q` under `pipefail` is a false-negative trap: grep closes the pipe on its
        # first match, strings dies of SIGPIPE, and the pipeline reports 141. Write the file, then
        # grep it.
        run: |
          strings -a target/aarch64-unknown-linux-musl/release/kroma > "$RUNNER_TEMP/musl.strings"
          grep -q 'OpenSSL 3' "$RUNNER_TEMP/musl.strings" || {
            echo "::error::the musl binary has no OpenSSL in it; TLS would fail at runtime"
            exit 1
          }
      - name: Install qemu (to execute the cross-built binary)
        run: sudo apt-get update && sudo apt-get install -y qemu-user-static
      - name: TLS smoke (real HTTPS + untrusted certificate rejected)
        # The same runtime gate as linux-x64, but for the cross-built artifact, executed under qemu.
        run: scripts/tls-smoke.sh target/aarch64-unknown-linux-musl/release/kroma qemu-aarch64-static
      - uses: actions/upload-artifact@v4
        with:
          name: linux-arm64
          path: target/aarch64-unknown-linux-musl/release/kroma
          if-no-files-found: error

  pack:
    name: pack npm tarball
    needs: [linux, windows, macos, android, musl]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect the six binaries
        uses: actions/download-artifact@v4
      - name: Place them where the packaging script expects them
        run: |
          set -euo pipefail
          install -Dm755 linux-x64/kroma   target/release/kroma
          install -Dm755 win32-x64/kroma.exe target/x86_64-pc-windows-gnu/release/kroma.exe
          install -Dm755 linux-arm64/kroma target/aarch64-unknown-linux-musl/release/kroma
          install -Dm755 android-arm64/kroma target/aarch64-linux-android/release/kroma
          install -Dm755 darwin-arm64/kroma target/aarch64-apple-darwin/release/kroma
          install -Dm755 darwin-x64/kroma  target/x86_64-apple-darwin/release/kroma
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      # Refuses to pack a missing target, and refuses to pack an artifact older than the sources it
      # claims to be built from: a silently shipped stale darwin or linux-arm64 binary is worse than
      # a failed release.
      - run: npm/build-npm-packages.sh
      - uses: actions/upload-artifact@v4
        with:
          name: kroma-cli-tarball
          path: npm/dist/*.tgz
          if-no-files-found: error

# Known limits (do not read as "verified"):
#   - android-arm64 is verified by static inspection of the artifact. Running it needs a real
#     device or an emulator, which no job here provides; that smoke is a manual release gate
#     (`adb push` the binary and run a real HTTPS request, then repeat with an untrusted CA).
#   - macOS binaries are only smoke-tested with `--version`; they use native-tls, whose runtime
#     behaviour (Security.framework) cannot be exercised on a Linux runner.
