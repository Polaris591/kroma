name: CI

# Why this exists: the Windows release build was broken for three months without anyone noticing,
# because verification used `cargo check` (which type-checks but never links) on all six targets.
# A single `cargo build --release --target x86_64-pc-windows-gnu` catches that whole class, so the
# per-push jobs below always *link* the artifacts users actually run.
#
# The Android and musl targets are built here too, not only on a release tag: both link a
# hand-written TLS backend, and both have shipped a binary whose TLS could never work (a link-only
# stub). Building them per push is what stops that from reaching a tag unnoticed.

permissions:
  contents: write

on:
  push:
    branches: [main, 'rc1/**']
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  OPENSSL_VERSION: '3.5.7'
  # RC1-04: the pin the shared fetch script verifies against. Empty here means every CI job that builds
  # against OpenSSL fails closed with an explicit message instead of extracting an unverified archive.
  OPENSSL_SHA256: 'a8c0d28a529ca480f9f36cf5792e2cd21984552a3c8e4aa11a24aa31aeac98e8'
  ANDROID_NDK_VERSION: '26.3.11579264'

jobs:
  lint-and-test:
    name: fmt, clippy, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install the pinned Rust toolchain
        # rust-toolchain.toml is the single source of truth: `cargo fmt --check` output is
        # toolchain-specific, so the fmt gate must run the exact pinned formatter.
        run: |
          toolchain="$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy
          rustup default "$toolchain"
          rustc --version

      # The cache key includes the source hash. Without it the restored `target/` can make cargo believe
      # a stale test binary is up to date: the suite then runs last commit's code and reports failures
      # that the current tree does not have (and hides fixes that it does).
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: src-${{ hashFiles('crates/**/*.rs', 'Cargo.lock', 'rust-toolchain.toml') }}

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Install the sandbox tooling the tests exercise
        # t09 asserts real bwrap isolation and fails when the binary is missing, which is the correct
        # behaviour. Install the tool instead of weakening the test.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          bwrap --version
      - name: cargo test
        # pipefail keeps this step's exit code equal to cargo's, so a failing suite still fails the job.
        run: |
          set -o pipefail
          cargo test --workspace --no-fail-fast 2>&1 | tee /tmp/kroma-tests.log
      - name: Publish the failure log when the tests fail
        if: failure()
        run: |
          mkdir -p ci-debug
          grep -E "^(---- .* stdout|failures:|test result: FAILED)" -A6 /tmp/kroma-tests.log \
            | head -400 > ci-debug/last-test-failure.txt || true
          git config user.email "ci@kroma.invalid"
          git config user.name "kroma-ci"
          git add -f ci-debug/last-test-failure.txt
          git commit -m "ci: capture the failing test output [skip ci]" || exit 0
          git push origin HEAD:ci-debug || true

      - name: JavaScript upgrade-helper checks
        run: node scripts/test-kroma-js-upgrade.js

      - name: The two bin/kroma.js copies must stay identical
        run: |
          if ! diff -q bin/kroma.js npm/kroma-cli/bin/kroma.js; then
            echo "::error::bin/kroma.js and npm/kroma-cli/bin/kroma.js have diverged; sync them"
            exit 1
          fi

  build-linux:
    name: release build (linux-gnu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install the pinned Rust toolchain
        run: |
          toolchain="$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy
          rustup default "$toolchain"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo build --release -p kroma-cli
      - run: ./target/release/kroma --version
      # Real TLS, not `--version`: the artifact performs an HTTPS request and an untrusted
      # certificate must be rejected.
      - name: TLS smoke (real HTTPS + untrusted certificate rejected)
        run: scripts/tls-smoke.sh target/release/kroma

  build-windows:
    name: release build (windows-gnu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install the pinned Rust toolchain
        run: |
          toolchain="$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy
          rustup default "$toolchain"
      - run: rustup target add x86_64-pc-windows-gnu
      - run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo build --release --target x86_64-pc-windows-gnu -p kroma-cli
      # A spurious OpenSSL dependency on this target is exactly the bug this job exists for:
      # mingw-w64 has no libssl, and Windows uses schannel, so no libssl/libcrypto may appear.
      - name: Windows binary must not depend on OpenSSL
        run: |
          if x86_64-w64-mingw32-objdump -p target/x86_64-pc-windows-gnu/release/kroma.exe \
             | grep -iE 'DLL Name: .*(ssl|crypto)'; then
            echo "::error::the Windows binary links an OpenSSL DLL; it should use schannel only"
            exit 1
          fi

  build-macos:
    name: release build (macOS, native)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install the pinned Rust toolchain
        run: |
          toolchain="$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy
          rustup default "$toolchain"
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # Built on a real Mac on purpose: since the Gate-3 audit macOS uses native-tls, so the link
      # needs Security.framework and CoreFoundation.framework and therefore a genuine SDK. Apple's
      # .tbd stubs carry per-symbol availability data that a hand-made stub cannot reproduce.
      - run: cargo build --release --target aarch64-apple-darwin -p kroma-cli
      - run: cargo build --release --target x86_64-apple-darwin -p kroma-cli
      - run: ./target/aarch64-apple-darwin/release/kroma --version
      - run: ./target/x86_64-apple-darwin/release/kroma --version

  # linux-arm64 and android-arm64 link a real static OpenSSL. Neither may fall back to a stub: the
  # stub-linked musl binary shipped once and failed every HTTPS request at runtime.
  build-musl:
    name: release build (linux-arm64 musl)
    runs-on: ubuntu-latest
    env:
      ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache
      ZIG_LOCAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install the pinned Rust toolchain
        run: |
          toolchain="$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy
          rustup default "$toolchain"
      - run: rustup target add aarch64-unknown-linux-musl
      - run: pip install --break-system-packages ziglang
      - name: Locate the zig installation
        run: |
          ZIG="$(python3 -c 'import os, ziglang; print(os.path.join(os.path.dirname(ziglang.__file__), "zig"))')"
          echo "ZIG=${ZIG}" >> "$GITHUB_ENV"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: openssl-cache
        with:
          path: openssl-musl
          key: openssl-musl-${{ env.OPENSSL_VERSION }}-${{ env.OPENSSL_SHA256 }}
      - name: Fetch OpenSSL sources
        if: steps.openssl-cache.outputs.cache-hit != 'true'
        run: |
          scripts/fetch-openssl.sh "${OPENSSL_VERSION}" "${OPENSSL_SHA256}" .
      - name: Build static OpenSSL for aarch64-musl
        if: steps.openssl-cache.outputs.cache-hit != 'true'
        run: scripts/build-musl-openssl.sh "openssl-${OPENSSL_VERSION}" "$PWD/openssl-musl"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_RUSTFLAGS: -C link-self-contained=no
        run: |
          printf '#!/bin/sh\nexport ZIG_GLOBAL_CACHE_DIR="%s"\nexport ZIG_LOCAL_CACHE_DIR="%s"\nexec "%s" cc -target aarch64-linux-musl -L"%s/openssl-musl/lib" "$@"\n' \
            "$ZIG_GLOBAL_CACHE_DIR" "$ZIG_LOCAL_CACHE_DIR" "$ZIG" "$GITHUB_WORKSPACE" > musl-linker.sh
          chmod +x musl-linker.sh
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER="$PWD/musl-linker.sh" \
            cargo build --release --target aarch64-unknown-linux-musl -p kroma-cli
      - name: The musl binary must actually contain OpenSSL
        # `strings | grep -q` under `pipefail` reports 141 (SIGPIPE) on a good artifact; grep a file.
        run: |
          strings -a target/aarch64-unknown-linux-musl/release/kroma > "$RUNNER_TEMP/musl.strings"
          grep -q 'OpenSSL 3' "$RUNNER_TEMP/musl.strings" || {
            echo "::error::the musl binary has no OpenSSL in it; TLS would fail at runtime"
            exit 1
          }
      - run: sudo apt-get update && sudo apt-get install -y qemu-user-static
      - name: TLS smoke under qemu (real HTTPS + untrusted certificate rejected)
        run: scripts/tls-smoke.sh target/aarch64-unknown-linux-musl/release/kroma qemu-aarch64-static

  build-android:
    name: release build (android-arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install the pinned Rust toolchain
        run: |
          toolchain="$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy
          rustup default "$toolchain"
      - run: rustup target add aarch64-linux-android
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      # The runner image already ships the Android SDK; the third-party setup action was failing
      # before it installed anything, and it is not needed for a build-only job. Use the preinstalled
      # SDK and install just the pinned NDK through its sdkmanager.
      - name: Locate the preinstalled Android SDK
        run: |
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$sdk" || { echo "::error::no Android SDK at $sdk"; exit 1; }
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          if [ -x "$sdk/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "SDKMANAGER=$sdk/cmdline-tools/latest/bin/sdkmanager" >> "$GITHUB_ENV"
          else
            echo "SDKMANAGER=$(command -v sdkmanager)" >> "$GITHUB_ENV"
          fi
      - name: Install the pinned NDK
        run: |
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install "ndk;${ANDROID_NDK_VERSION}"
          test -d "${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" || { echo "::error::NDK not installed"; exit 1; }
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: openssl-cache
        with:
          path: openssl-android
          key: openssl-android-${{ env.OPENSSL_VERSION }}-${{ env.ANDROID_NDK_VERSION }}-${{ env.OPENSSL_SHA256 }}
      - name: Fetch OpenSSL sources
        if: steps.openssl-cache.outputs.cache-hit != 'true'
        run: |
          scripts/fetch-openssl.sh "${OPENSSL_VERSION}" "${OPENSSL_SHA256}" .
      - name: Build static OpenSSL for aarch64-linux-android
        if: steps.openssl-cache.outputs.cache-hit != 'true'
        run: |
          export ANDROID_NDK_ROOT="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}"
          scripts/build-android-openssl.sh "openssl-${OPENSSL_VERSION}" "$PWD/openssl-android" 24
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Build
        env:
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: ${{ github.workspace }}/android-linker.sh
        run: |
          NDK="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64"
          printf '#!/bin/sh\nexec "%s/bin/aarch64-linux-android24-clang" -L"%s/openssl-android/lib" "$@"\n' \
            "$NDK" "$GITHUB_WORKSPACE" > android-linker.sh
          chmod +x android-linker.sh
          cargo build --release --target aarch64-linux-android -p kroma-cli
      - name: The Android binary must carry real OpenSSL, not link-only stubs
        run: |
          NDK_BIN="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          BIN=target/aarch64-linux-android/release/kroma
          "${NDK_BIN}/llvm-readelf" -d "$BIN" > "$RUNNER_TEMP/android.dynamic"
          if grep -E 'NEEDED.*(libssl|libcrypto)' "$RUNNER_TEMP/android.dynamic"; then
            echo "::error::the Android binary dynamically requires libssl/libcrypto (BoringSSL is not OpenSSL ABI)"
            exit 1
          fi
          "${NDK_BIN}/llvm-nm" "$BIN" > "$RUNNER_TEMP/android.nm"
          for sym in TLS_client_method SSL_CTX_new SSL_ctrl SSL_set1_host SSL_connect; do
            grep -qE " [Tt] ${sym}$" "$RUNNER_TEMP/android.nm" || {
              echo "::error::${sym} is not linked into the Android binary; its TLS backend is incomplete"
              exit 1
            }
          done
      # No runtime smoke here: executing an Android binary needs a device or emulator, and this job
      # does not fake that. The TLS runtime gate for Android is a manual release step.
