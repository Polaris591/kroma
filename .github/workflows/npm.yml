name: npm distribution

# Build and installation-test the npm tarballs on native runners. This workflow
# never publishes: it has read-only repository access, no registry credentials,
# and stops after uploading the tarballs as artifacts.

on:
  push:
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build.rs'
      - 'npm/**'
      - 'examples/plugins/**'
      - '.github/workflows/npm.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build.rs'
      - 'npm/**'
      - 'examples/plugins/**'
      - '.github/workflows/npm.yml'
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ""


permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win32-x64
            host_platform: win32
            host_arch: x64
            target: x86_64-pc-windows-msvc
            binary: target/release/kroma.exe
          - os: ubuntu-22.04
            platform: linux-x64
            host_platform: linux
            host_arch: x64
            target: x86_64-unknown-linux-gnu
            binary: target/release/kroma
          - os: ubuntu-24.04-arm
            platform: linux-arm64
            host_platform: linux
            host_arch: arm64
            target: aarch64-unknown-linux-gnu
            binary: target/release/kroma
          - os: macos-15-intel
            platform: darwin-x64
            host_platform: darwin
            host_arch: x64
            target: x86_64-apple-darwin
            binary: target/release/kroma
          - os: macos-15
            platform: darwin-arm64
            host_platform: darwin
            host_arch: arm64
            target: aarch64-apple-darwin
            binary: target/release/kroma
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          components: clippy, rustfmt
      - name: Tagged release regressions
        if: inputs.ref != ''
        run: |
          cargo fmt --all -- --check
          cargo test --locked --tests
          cargo clippy --locked --all-targets -- -D warnings
      - name: Verify native runner and Rust host
        shell: bash
        run: |
          node -e 'const {execFileSync}=require("node:child_process"); const [host, arch, target]=process.argv.slice(1); if (process.platform!==host || process.arch!==arch) { console.error("Expected " + host + "/" + arch + " but this runner is " + process.platform + "/" + process.arch + "."); process.exit(1); } const line=execFileSync("rustc", ["-vV"], {encoding: "utf8"}).split(/\r?\n/).find(value => value.startsWith("host: ")); const rustHost=line && line.slice(6).trim(); if (rustHost!==target) { console.error("Expected Rust host " + target + " but rustc reports " + (rustHost || "no host line") + "."); process.exit(1); } console.log("Native runner verified: " + process.platform + "/" + process.arch + ", rustc host " + rustHost + ".");' ${{ matrix.host_platform }} ${{ matrix.host_arch }} ${{ matrix.target }}
      - name: Test packaging tools
        run: npm --prefix npm test
      - name: Build binary
        run: cargo build --release --locked --bin kroma
      - name: Build official project-memory worker
        run: cargo build --release --locked --manifest-path examples/plugins/project-memory/Cargo.toml
      - name: Stage npm packages
        shell: bash
        run: |
          memory_bin="examples/plugins/project-memory/target/release/kroma-memory"
          if [ "${{ matrix.host_platform }}" = "win32" ]; then memory_bin="$memory_bin.exe"; fi
          node npm/stage.cjs --target "${{ matrix.target }}" --binary "${{ matrix.binary }}" --memory-binary "$memory_bin" --out .npm-dist
      - name: Smoke-test installation
        run: npm --prefix npm run smoke -- ../.npm-dist
      - name: Upload npm tarballs
        uses: actions/upload-artifact@v4
        with:
          name: kroma-npm-${{ matrix.platform }}
          path: .npm-dist/tarballs/*.tgz
          if-no-files-found: error
          include-hidden-files: true
