name: Core checks

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Format
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check
      - name: Test
        run: cargo test --locked
      - name: JavaScript plugin contracts
        run: node --test examples/plugins/web/web.test.js
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Native PowerShell fallback
        if: matrix.os == 'windows-latest'
        env:
          KROMA_SHELL: powershell.exe
        run: cargo test --locked windows_shell_reports_output_and_exit_code
