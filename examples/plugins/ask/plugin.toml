id = "ask"
name = "Ask"
version = "0.1.0"
description = "Let the model ask the user to pick between concrete options, single or multiple choice"

prompt = """
Ask only when project evidence cannot resolve a consequential choice. Ask one question with 2-4 concrete options before proceeding; never request secrets or treat the answer as approval. If dismissed, decide from evidence. Otherwise act without asking.
"""

# No command: the host runs this tool itself, so there is no process to start.
[[tools]]
name = "ask"
host = "ask_user"
description = "Ask the user to choose from two or more concrete options. Single or multiple choice; a free-form answer is always available."
