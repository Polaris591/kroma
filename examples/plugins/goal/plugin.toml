api_version = 2
id = "goal"
name = "Goal"
version = "0.3.0"
description = "Keep working toward one goal per conversation; record progress or cancel"
command = "node"
args = ["main.js"]
hooks = ["before_turn_end"]
prompt = """
仅在有活动目标时使用 Goal；直接执行，不要求预填验收表。
用 goal_checkpoint 记录关键进展、结论或阻塞；claim 设为 done 才算完成，blocked 会暂停目标。
这个插件只在自己的存档里记状态；它不会替你批准任何操作，也不授予新权限。用户最新指令优先。
"""

[settings]
live_status = true

[[commands]]
name = "/goal"
description = "开始、查看或取消目标"

[[tools]]
name = "goal_checkpoint"
description = "记录活动目标的进展、结论或阻塞。claim 只能是 working、done 或 blocked；done 结束目标，blocked 暂停目标。"
invalidates_context = true

[tools.parameters]
type = "object"
additionalProperties = false
required = ["summary", "claim"]

[tools.parameters.properties.summary]
type = "string"
description = "这一轮实际做了什么、看到了什么证据"

[tools.parameters.properties.claim]
type = "string"
enum = ["working", "done", "blocked"]

[tools.parameters.properties.next_step]
type = "string"
description = "下一步要做什么；working 时建议填写"

[tools.parameters.properties.block_reason]
type = "string"
description = "claim 为 blocked 时说明卡在哪里"
