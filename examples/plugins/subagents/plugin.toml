id = "subagents"
name = "Subagents"
version = "1.0.0"
description = "Delegate self-contained tasks to isolated Kroma agents"
command = "node"
args = ["main.js"]
prompt = """
Delegate only when the side work would flood this conversation with search results, logs or file contents, or when independent tasks can genuinely run in parallel. Each subtask runs as its own Kroma process with a separate session and does not inherit this conversation, so make it self-contained: goal, relevant files and facts, allowed changes, constraints, and the evidence to return (file:line, commands run, remaining risks). Use one task per independent job and split dependent work into later calls. Parallel edits need non-overlapping files or separate working directories. A completed result only means the child exited cleanly with a final answer; verify claims, diffs and tests before relying on it. Each result carries a resume token; pass it as tasks[].resume to continue that child's saved conversation, not to retry a failure. Never delegate from inside a subagent: nesting is refused.
"""

[settings]
max_parallel = 3
max_output_chars = 12000
# Zero disables the child deadline. Long-running work is cancelled explicitly.
task_timeout_secs = 0
# Model for every child process, exactly as the endpoint names it. Empty or
# removed means "inherit the parent conversation's model and profile".
# Change it with `kroma plugins set subagents model <id>`.
model = ""
# DeepSeek thinking tier: off, enabled, high or max. Empty inherits the parent.
thinking = ""

[[tools]]
name = "subagent"
description = "Delegate independent tasks to separate Kroma agents. Each task runs in its own session with the given working directory. Results return in input order with status, answer, usage, tool-call count and an evidence directory; each started task also carries a resume token. Tasks do not inherit this conversation; provide context, scope and acceptance criteria. A completed status means only that the child exited cleanly with a final answer — verify the work. Each task is at most 16 KiB, so point at files instead of pasting them. Parallel edits need non-overlapping files or separate working directories."
streaming = true
# No implicit host deadline; KROMA_PLUGIN_TOOL_TIMEOUT_SECS can still cap it.

[tools.parameters]
type = "object"
additionalProperties = false
[tools.parameters.properties.action]
type = "string"
enum = ["run", "status", "wait", "continue", "cancel"]
description = "Session-as-Job lifecycle action. Omit for backward-compatible synchronous tasks."
[tools.parameters.properties.job_id]
type = "string"
description = "Job identifier returned by run, used by status, wait and cancel."
[tools.parameters.properties.wait_ms]
type = "integer"
minimum = 0
maximum = 750
description = "One short nonblocking wait poll (0..750 ms). Poll again rather than holding the plugin worker."
[tools.parameters.properties.task]
type = "string"
description = "Single-task shorthand for run or new instruction for continue."
[tools.parameters.properties.resume]
type = "string"
description = "Session resume token required by continue."
[tools.parameters.properties.profile]
type = "string"
description = "Optional profile used for single-task run or continue."
[tools.parameters.properties.label]
type = "string"
description = "Optional single-task label."
[tools.parameters.properties.cwd]
type = "string"
description = "Optional working directory for a new single-task run."
[tools.parameters.properties.tasks]
type = "array"
minItems = 1
maxItems = 8
[tools.parameters.properties.tasks.items]
type = "object"
additionalProperties = false
required = ["task"]
[tools.parameters.properties.tasks.items.properties.task]
type = "string"
description = "Self-contained instruction with context, scope, constraints and what to return."
[tools.parameters.properties.tasks.items.properties.cwd]
type = "string"
description = "Existing directory for this task. Defaults to the current working directory."
[tools.parameters.properties.tasks.items.properties.resume]
type = "string"
description = "Optional resume token from an earlier result. Continues that child's saved conversation in the same cwd; it is a fork, not a retry."
[tools.parameters.properties.tasks.items.properties.profile]
type = "string"
description = "Agent profile (general, explore, planner, reviewer, verifier or custom)."
[tools.parameters.properties.tasks.items.properties.label]
type = "string"
description = "Optional readable task label (1..60 characters)."
[tools.parameters.properties.tasks.items.properties.complexity]
type = "string"
enum = ["light", "medium", "heavy"]
description = "Model tier for auto profiles; defaults to medium."

