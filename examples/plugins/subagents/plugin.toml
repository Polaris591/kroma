id = "subagents"
name = "Subagents"
version = "3.0.0"
description = "Delegate a self-contained task to an isolated Kroma agent"
command = "node"
args = ["main.js"]
# One short sentence: the tool description below carries the rest.
prompt = """
Use the subagent tool for side work that would flood this conversation with search results, logs or file contents, and for independent jobs that can run in parallel. One call runs every task and returns each child's answer, so the call ends when they do; give the whole batch in one call instead of polling.
"""

[settings]
max_parallel = 8
# Default child deadline in seconds; a stuck child must not run forever.
# Set it to 0 to disable the deadline; stop a run with the normal task cancel.
task_timeout_secs = 1800
# Absolute path to the Kroma binary; empty uses PATH or KROMA_BIN.
kroma_bin = ""
# Whether children load this machine's plugins. "none" keeps a child fast and
# self-contained; "inherit" gives it the same plugins you have.
child_plugins = "none"

[[tools]]
name = "subagent"
description = "Delegate self-contained tasks to separate Kroma agents; one call runs the whole batch and returns each child's answer, so give the batch in one call instead of polling. A child has its own session, cwd, model and toolset and cannot delegate further, so state the goal, paths, constraints and what to return; point at files instead of pasting them."
streaming = true

[tools.parameters]
type = "object"
additionalProperties = false
[tools.parameters.properties.task]
type = "string"
description = "Single-task shorthand for tasks[0].task."
[tools.parameters.properties.cwd]
type = "string"
description = "Optional working directory for the single task."
[tools.parameters.properties.label]
type = "string"
description = "Optional readable label for the single task (1..60 characters)."
[tools.parameters.properties.resume]
type = "string"
description = "Optional resume token for the single task."
[tools.parameters.properties.tasks]
type = "array"
minItems = 1
maxItems = 8
[tools.parameters.properties.tasks.items]
type = "object"
additionalProperties = false
required = ["task"]
[tools.parameters.properties.tasks.items.properties.task]
type = "string"
description = "Self-contained instruction with context, scope, constraints and what to return."
[tools.parameters.properties.tasks.items.properties.cwd]
type = "string"
description = "Existing directory for this task. Defaults to the current working directory."
[tools.parameters.properties.tasks.items.properties.resume]
type = "string"
description = "Optional resume token from an earlier answer; continues that child's saved conversation in its recorded directory. Omit for a new task."
[tools.parameters.properties.tasks.items.properties.label]
type = "string"
description = "Optional readable task label (1..60 characters)."
