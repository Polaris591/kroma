id = "subagents"
name = "Subagents"
version = "0.2.0"
description = "Delegate self-contained tasks to isolated Kroma agents"
command = "node"
args = ["main.js"]
prompt = """
For work that is genuinely independent, you may delegate it with the subagent tool.
Each subtask runs as its own Kroma process with a separate session, so give it the context it needs: goal, relevant files and facts, allowed changes, constraints, and the evidence to return. It does not inherit this conversation. Use one task per independent job; split dependent work into later calls. Parallel edits need non-overlapping files or separate working directories. On failure, inspect the results and evidence before retrying, and never assume a retry is free or safe.
"""

[settings]
max_parallel = 3
max_output_chars = 12000
task_timeout_secs = 300
# Model for every child process, exactly as the endpoint names it. Empty or
# removed means "inherit the parent conversation's model and profile".
# Change it with `kroma plugins set subagents model <id>`.
model = "deepseek-v4.1-flash"
# DeepSeek thinking tier: off, enabled, high or max. Empty inherits the parent.
thinking = "max"

[[tools]]
name = "subagent"
description = "Delegate independent tasks to separate Kroma agents. Each task runs in its own session with the given working directory. Results return in input order with status, answer, usage and an evidence directory. Tasks do not inherit this conversation; provide context, scope and acceptance criteria. Each task is at most 16 KiB, so point at files instead of pasting them. Parallel edits need non-overlapping files or separate working directories."
streaming = true
timeout_secs = 600

[tools.parameters]
type = "object"
additionalProperties = false
required = ["tasks"]
[tools.parameters.properties.tasks]
type = "array"
minItems = 1
maxItems = 8
[tools.parameters.properties.tasks.items]
type = "object"
additionalProperties = false
required = ["task"]
[tools.parameters.properties.tasks.items.properties.task]
type = "string"
description = "Self-contained instruction with context, scope, constraints and what to return."
[tools.parameters.properties.tasks.items.properties.cwd]
type = "string"
description = "Existing directory for this task. Defaults to the current working directory."

