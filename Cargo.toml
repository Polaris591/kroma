[workspace]
resolver = "2"
members = [
    "crates/kroma-core",
    "crates/kroma-cli",
]

[workspace.package]
version = "1.3.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "io-std", "time", "sync", "net", "fs", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
regex = "1"
uuid = { version = "=1.15.1", features = ["v4", "serde"] }
thiserror = "2"
libc = "0.2"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_System_Console",
] }
native-tls = "0.2"
tokio-native-tls = "0.3"
