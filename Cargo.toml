[workspace]
resolver = "2"
members = [
    "crates/harness-core",
    "crates/harness-cli",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "io-std", "time", "sync", "net", "fs", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
regex = "1"
uuid = { version = "=1.15.1", features = ["v4", "serde"] }
thiserror = "2"
libc = "0.2"
