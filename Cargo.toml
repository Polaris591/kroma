[package]
name = "kroma"
version = "0.4.0"
license = "MIT"
edition = "2021"
rust-version = "1.85"
description = "A minimal Rust AI agent harness"

[dependencies]
anyhow = "1"
arboard = { version = "=3.4.1", default-features = false, features = ["image-data"] }
base64 = "0.22"
png = "0.17"
image = { version = "=0.25.5", default-features = false }
futures-util = "0.3"
crossterm = { version = "0.28.1", features = ["event-stream"] }
pulldown-cmark = "0.13"
ratatui = "0.29"
toml = "0.8"
unicode-width = "0.2"
unicode-segmentation = "1.13"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "io-std", "signal", "time", "sync"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Console", "Win32_Storage_FileSystem", "Win32_Security", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
